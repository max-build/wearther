<!doctype html>
<html lang="en" data-theme="wearther">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WEARther — what to wear today</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body class="min-h-screen bg-linear-to-br from-primary/15 via-base-100 to-secondary/15">
    <main class="mx-auto w-full max-w-2xl px-4 py-10 sm:py-16">
      <header class="mb-8 text-center">
        <span class="badge badge-primary badge-soft mb-4 font-semibold">✨ AI outfit stylist</span>
        <h1 class="bg-linear-to-r from-primary to-secondary bg-clip-text text-5xl font-extrabold tracking-tight text-transparent sm:text-6xl">
          WEARther
        </h1>
        <p class="mx-auto mt-3 max-w-md text-base-content/70">
          Weather-smart outfits that fit in where you live.
        </p>
      </header>

      <form id="form" class="card bg-base-100 shadow-xl shadow-primary/10" novalidate>
        <div class="card-body gap-2 p-6 sm:p-8">
          <fieldset class="fieldset">
            <legend class="fieldset-legend text-sm">Which city are you in?</legend>
            <div class="relative">
              <label class="input input-lg w-full">
                <svg class="h-5 w-5 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
                <input id="city" type="text" class="grow" placeholder="Start typing your city…" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="city-results" required />
              </label>
              <ul id="city-results" role="listbox" class="menu absolute z-30 mt-2 max-h-72 w-full flex-nowrap overflow-y-auto rounded-box border border-base-300 bg-base-100 p-2 shadow-xl" hidden></ul>
            </div>
          </fieldset>

          <fieldset class="fieldset">
            <legend class="fieldset-legend text-sm">What kind of outfit would you like?</legend>
            <select id="style" class="select select-lg w-full" required>
              <option value="">Select an outfit style</option>
              <option value="female">Feminine</option>
              <option value="male">Masculine</option>
              <option value="unisex">Unisex</option>
            </select>
          </fieldset>

          <div class="mt-4 flex flex-col gap-3 sm:flex-row">
            <button type="button" id="locate" class="btn btn-outline btn-lg flex-1">📍 Find my location</button>
            <button type="submit" id="submit" class="btn btn-primary btn-lg flex-1" disabled>Recommend an outfit</button>
          </div>

          <div class="mt-2 flex min-h-8 items-center justify-center gap-2 text-center">
            <span id="spinner" class="loading loading-dots loading-md text-primary hidden"></span>
            <p id="status" class="text-sm text-base-content/70" role="status" aria-live="polite"></p>
          </div>
          <p id="quota" class="text-center text-xs text-base-content/50"></p>
        </div>
      </form>

      <section id="result" class="card mt-6 bg-base-100 shadow-xl shadow-primary/10" hidden>
        <div class="card-body gap-5 p-6 sm:p-8">
          <div id="weather"></div>
          <div id="outfit" class="border-t border-base-300 pt-5" aria-live="polite"></div>
          <button type="button" id="again" class="btn btn-primary btn-lg w-full" hidden>Get another recommendation</button>
          <p id="meta" class="text-center text-xs text-base-content/50"></p>
        </div>
      </section>
    </main>
  </body>
</html>
